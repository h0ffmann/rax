name: image

# rax-server's image (Dockerfile.server) on GitHub's registry, ghcr.io/piabrota/rax-server, for
# clusters that pull it instead of building it, such as piabrota/nix-os's KubeSolo node. A pull
# request builds the image and pushes nothing; a push to main publishes it as `main` and
# `sha-<commit>`. Deploy by digest: the run summary prints it.
on:
  push:
    branches: [main]
    paths: ['crates/**', 'proto/**', 'Cargo.toml', 'Cargo.lock', 'Dockerfile.server', '.dockerignore', '.github/workflows/image.yml']
  pull_request:
    paths: ['crates/**', 'proto/**', 'Cargo.toml', 'Cargo.lock', 'Dockerfile.server', '.dockerignore', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rax-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rax-server
          tags: |
            type=ref,event=branch
            type=sha,format=short
      # amd64 only: the clusters that pull it are x86_64, and building Rust for arm64 under QEMU
      # takes far longer than the build itself.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rax-server
          cache-to: type=gha,scope=rax-server,mode=max
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo '### rax-server'
            echo
            echo "Pushed: $PUSHED"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
