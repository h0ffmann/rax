[package]
name = "rax-substrate"
description = "A client for the Agent Substrate control API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
prost.workspace = true
prost-types.workspace = true
rand.workspace = true
rax-api.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream = { workspace = true, optional = true }
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[build-dependencies]
prost.workspace = true
prost-build.workspace = true
protox.workspace = true
tonic-prost-build.workspace = true

[features]
# An in-memory Substrate server for tests of code that uses the client.
testing = ["dep:tokio-stream"]

[dev-dependencies]
rcgen = "0.13"
rustls.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
rax-substrate = { path = ".", features = ["testing"] }
